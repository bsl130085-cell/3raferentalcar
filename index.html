<style>

let lang='en', activeFilter='all';

const byName=Object.fromEntries(cars.map(c=>[c.name,c]));
function category(name){const n=name.toLowerCase();if(/lamb|ferari|ferrari|mclaren|r8|corvette|gt3|911|sto|sf90|aventador/.test(n))return 'supercars';if(/convertible|convrtible|spider|cabr|cle450|sl-63/.test(n))return 'convertibles';if(/x6|x4|q5|g class|g-900|g900|g63|range|defender|escalade|tahoe|patrol|captiva|jetour|youcn|yukon|bentayga|urus/.test(n))return 'suv';return 'sedans'}
function brand(name){return name.trim().split(/\s+/)[0].replace('Lamborgine','Lamborghini').replace('Ferari','Ferrari').replace('Porche','Porsche')}
function tx(k){return (T[lang]&&T[lang][k])||T.en[k]||k}
function setLang(l){lang=T[l]?l:'en';document.documentElement.lang=lang;document.documentElement.dir=(lang==='ar'||lang==='he')?'rtl':'ltr';document.body.dir=document.documentElement.dir;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tx(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=tx(el.dataset.i18nPlaceholder));document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));populateQuickCars();renderFeatured();renderFleet();renderVideos();try{localStorage.setItem('3rafe-lang',lang)}catch(e){}}

function wa(name=''){const msg=name?`Hello 3RAFE Signature, I want to ask about ${name} in Dubai. Please send me availability and details.`:'Hello 3RAFE Signature, I want to rent a car in Dubai.';return 'https://wa.me/972544756068?text='+encodeURIComponent(msg)}
let currentCar=null;
function todayISO(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}
function bookingUrl(name,start,end){let msg='';if(lang==='ar')msg=`مرحبا 3RAFE Signature، بدي أحجز ${name} في دبي.\nتاريخ الاستلام: ${start}\nتاريخ التسليم: ${end}\nلو سمحتوا أكدوا التوفر والسعر.`;else if(lang==='he')msg=`שלום 3RAFE Signature, אני רוצה להזמין ${name} בדובאי.\nתאריך איסוף: ${start}\nתאריך החזרה: ${end}\nאשמח לאישור זמינות ומחיר.`;else msg=`Hello 3RAFE Signature, I would like to book ${name} in Dubai.\nPickup date: ${start}\nReturn date: ${end}\nPlease confirm availability and price.`;return 'https://wa.me/972544756068?text='+encodeURIComponent(msg)}
function validBooking(name,start,end){if(!name){alert(tx('carRequired'));return false}if(!start||!end){alert(tx('dateRequired'));return false}if(end<start){alert(tx('dateOrder'));return false}return true}
function sendBooking(name,start,end){if(!validBooking(name,start,end))return;window.open(bookingUrl(name,start,end),'_blank','noopener')}
function populateQuickCars(){const s=document.getElementById('quickCar');if(!s)return;const old=s.value;s.innerHTML=`<option value="">${tx('chooseCar')}</option>`+cars.map(c=>`<option value="${c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${c.name}</option>`).join('');if([...s.options].some(o=>o.value===old))s.value=old}
function setupDates(a,b){const t=todayISO();a.min=t;b.min=t;a.addEventListener('change',()=>{b.min=a.value||t;if(b.value&&a.value&&b.value<a.value)b.value=''})}

function openCar(c){currentCar=c;document.getElementById('modalTitle').textContent=c.name;document.getElementById('bookingCarName').textContent=c.name;document.getElementById('modalStart').value='';document.getElementById('modalEnd').value='';const g=document.getElementById('gallery');g.innerHTML='';if(!c.images.length){g.innerHTML=`<div class="emptyCar">${tx('noPhotos')}</div>`}else{c.images.forEach(src=>{const im=new Image();im.loading='lazy';im.src=src;im.alt=c.name;im.onerror=()=>im.remove();g.appendChild(im)})}document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
document.getElementById('closeBtn').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})
document.getElementById('quickSend').onclick=()=>sendBooking(document.getElementById('quickCar').value,document.getElementById('quickStart').value,document.getElementById('quickEnd').value);
document.getElementById('modalSend').onclick=()=>sendBooking(currentCar?.name||'',document.getElementById('modalStart').value,document.getElementById('modalEnd').value);
setupDates(document.getElementById('quickStart'),document.getElementById('quickEnd'));setupDates(document.getElementById('modalStart'),document.getElementById('modalEnd'));

function renderFeatured(){const box=document.getElementById('featuredGrid');box.innerHTML='';featuredNames.forEach(n=>{const c=byName[n];if(!c||!c.images.length)return;const a=document.createElement('article');a.className='featureCard reveal show';a.innerHTML=`<img loading="lazy" src="${c.images[0]}" alt="${c.name}"><div class="featureInfo"><div><h3>${c.name}</h3><div class="featureMeta">${c.images.length} ${tx('photos')} · ${brand(c.name)}</div></div><div class="circleArrow">↗</div></div>`;a.onclick=()=>openCar(c);box.appendChild(a)})}
function renderFleet(){const q=document.getElementById('search').value.trim().toLowerCase();const list=cars.filter(c=>(activeFilter==='all'||category(c.name)===activeFilter)&&(!q||c.name.toLowerCase().includes(q)));const box=document.getElementById('fleetGrid');box.innerHTML='';list.forEach((c,i)=>{const a=document.createElement('article');a.className='carCard reveal show';const cover=c.images[0];a.innerHTML=`<div class="carMedia">${cover?`<img loading="lazy" src="${cover}" alt="${c.name}">`:`<div class="emptyCar">${tx('noPhotos')}</div>`}${i<6?'<span class="badge">Signature</span>':''}</div><div class="carBody"><h3>${c.name}</h3><div class="carBottom"><span>${c.images.length} ${tx('photos')}</span><span class="miniArrow">↗</span></div></div>`;a.onclick=()=>openCar(c);box.appendChild(a)})}

document.getElementById('search').addEventListener('input',renderFleet);document.querySelectorAll('.filterBtn').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filterBtn').forEach(x=>x.classList.toggle('active',x===b));renderFleet()})

function renderVideos(){const rail=document.getElementById('videoRail');rail.innerHTML='';videoUrls.forEach((u,i)=>{const c=document.createElement('article');c.className='videoCard';const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=u;if(videoPosters[i])v.poster=videoPosters[i];v.addEventListener('play',()=>{rail.querySelectorAll('video').forEach(o=>{if(o!==v&&!o.paused)o.pause()})});v.addEventListener('error',()=>{v.poster=videoPosters[i]||''});const n=document.createElement('div');n.className='videoNum';n.textContent=`${tx('film')} ${String(i+1).padStart(2,'0')}`;c.append(v,n);rail.appendChild(c)})}

const hm=document.getElementById('heroMedia'),fn=document.getElementById('focusName'),fd=document.getElementById('focusDots');heroes.forEach((h,i)=>{const d=document.createElement('div');d.className='heroSlide'+(i===0?' active':'');d.style.backgroundImage=`url("${h.img}")`;hm.appendChild(d);const dot=document.createElement('i');dot.className=i===0?'on':'';fd.appendChild(dot)});let hi=0;fn.textContent=heroes[0]?.name||'3RAFE';setInterval(()=>{const slides=[...hm.children],dots=[...fd.children];if(!slides.length)return;slides[hi].classList.remove('active');dots[hi]?.classList.remove('on');hi=(hi+1)%slides.length;slides[hi].classList.add('active');dots[hi]?.classList.add('on');fn.textContent=heroes[hi].name},6200);

const brands=['Lamborghini','Ferrari','Rolls-Royce','McLaren','Porsche','BMW M','Mercedes-AMG','Range Rover','Bentley','Audi Sport'];document.getElementById('marquee').innerHTML=[...brands,...brands].map(x=>`<span>${x}</span>`).join('');

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
let saved='en';try{saved=localStorage.getItem('3rafe-lang')||'en'}catch(e){}setLang(saved);
</script>
